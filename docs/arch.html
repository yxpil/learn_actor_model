<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actor model architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <!-- client -->
  <rect x="60" y="160" width="130" height="60" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">client</text>
  <text x="125" y="204" text-anchor="middle" font-size="10.5" fill="#b45309">sends msg</text>

  <!-- order actor -->
  <rect x="300" y="120" width="220" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="410" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">order actor</text>
  <rect x="320" y="162" width="180" height="28" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="410" y="180" text-anchor="middle" font-size="10.5" fill="#475569">mailbox: [msg, msg, ...]</text>
  <text x="410" y="212" text-anchor="middle" font-size="11" fill="#475569">processes one at a time</text>
  <text x="410" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">no shared state, only msgs</text>

  <!-- inventory actor -->
  <rect x="640" y="120" width="220" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="750" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">inventory actor</text>
  <rect x="660" y="162" width="180" height="28" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="750" y="180" text-anchor="middle" font-size="10.5" fill="#166534">mailbox: [msg, ...]</text>
  <text x="750" y="212" text-anchor="middle" font-size="11" fill="#166534">crash → restart → drain</text>
  <text x="750" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">mailbox survives restart</text>

  <line x1="190" y1="190" x2="300" y2="190" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="520" y1="190" x2="640" y2="190" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="640" y1="220" x2="520" y2="220" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <text x="500" y="320" text-anchor="middle" font-size="11.5" fill="#64748b">Actors never share memory; they only exchange async messages through mailboxes.</text>
</svg>
</body>
</html>
