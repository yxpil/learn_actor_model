<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actor sequence</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <g font-size="12" font-weight="700">
    <rect x="80" y="20" width="120" height="32" rx="8" fill="#fff7e6" stroke="#d97706"/><text x="140" y="41" text-anchor="middle" fill="#92400e">client</text>
    <rect x="320" y="20" width="140" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="390" y="41" text-anchor="middle" fill="#1d4ed8">order actor</text>
    <rect x="620" y="20" width="160" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="700" y="41" text-anchor="middle" fill="#15803d">inventory actor</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="140" y1="52" x2="140" y2="410"/>
    <line x1="390" y1="52" x2="390" y2="410"/>
    <line x1="700" y1="52" x2="700" y2="410"/>
  </g>

  <line x1="140" y1="80" x2="385" y2="80" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="262" y="74" text-anchor="middle" font-size="11" fill="#1e40af">CreateOrder</text>
  <line x1="390" y1="110" x2="695" y2="110" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="542" y="104" text-anchor="middle" font-size="11" fill="#1e40af">ReserveStock</text>
  <line x1="700" y1="140" x2="395" y2="140" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="547" y="134" text-anchor="middle" font-size="11" fill="#15803d">StockReserved</text>

  <text x="60" y="190" font-size="12" font-weight="700" fill="#0f172a">crash &amp; restart</text>
  <line x1="700" y1="215" x2="700" y2="245" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="700" y="262" text-anchor="middle" font-size="11" fill="#b91c1c">crashes on bad order</text>
  <line x1="700" y1="290" x2="700" y2="315" stroke="#16a34a" stroke-width="1.4"/>
  <text x="700" y="332" text-anchor="middle" font-size="11" fill="#15803d">restart → drain mailbox</text>
  <line x1="700" y1="355" x2="395" y2="355" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="547" y="349" text-anchor="middle" font-size="11" fill="#15803d">remaining msgs processed</text>
</svg>
</body>
</html>
